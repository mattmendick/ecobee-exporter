name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash -n rebuild.sh
      - run: ECOBEE_APPKEY=synthetic-test-key docker compose config --quiet
      - run: docker build -t ecobee-exporter:test .
