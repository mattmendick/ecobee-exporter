services:
  ecobee-exporter:
    build: .
    image: ecobee-exporter:local
    restart: unless-stopped
    # Preserve access to the existing root-owned authentication cache.
    user: "0:0"
    environment:
      ECOBEE_APPKEY: ${ECOBEE_APPKEY:?Set ECOBEE_APPKEY in .env or your environment}
    ports:
      - "9098:9098"
    volumes:
      - auth:/db

volumes:
  auth:
    external: true
    name: ecobee-exporter_ecobee-exporter
